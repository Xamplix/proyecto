<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; font-family: 'Inter', sans-serif; background: #14141e; padding: 0; display: flex; }

  h1 { font-size: 72px; color: #fff; font-weight: 900; line-height: 1.1; margin-bottom: 20px; }
  .sub { font-size: 30px; color: #1A73E8; font-weight: 600; margin-bottom: 50px; }
  .tag { font-size: 18px; color: #666; }
  .info { position: absolute; bottom: 80px; left: 180px; }
  .info p { font-size: 16px; color: #555; line-height: 1.8; }
</style>
</head><body>
  <div class="bar"></div>
  <div class="content">
    <div class="label">Grupo 7</div>

    <div class="tag">Taller  |  Sesion 2</div>
  </div>

  </div>
</body></html>
