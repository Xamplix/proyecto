<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; font-family: 'Inter', sans-serif; background: #fafafa; padding: 70px 100px; }
  h1 { font-size: 56px; color: #1a1a1a; font-weight: 700; }
  .accent { width: 120px; height: 4px; background: #1A73E8; margin: 18px 0 40px; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  th { padding: 22px 35px; font-size: 22px; text-align: center; color: #fff; }
  th:first-child { text-align: left; background: #333; }
  th:nth-child(2) { background: #D93025; }
  th:nth-child(3) { background: #1E8850; }
  td { padding: 18px 35px; font-size: 21px; text-align: center; border-bottom: 1px solid #eee; }
  td:first-child { text-align: left; font-weight: 600; color: #333; }
  tr:nth-child(even) td { background: #f5f5f7; }
  tr:nth-child(odd) td { background: #fff; }
  td:nth-child(2) { color: #D93025; }
  td:nth-child(3) { color: #1E8850; font-weight: 600; }
</style>
</head><body>
  <h1>Antes vs Despues</h1>
  <div class="accent"></div>
  <table>
    <tr><th>Metrica</th><th>Saboteado</th><th>Corregido</th></tr>
    <tr><td>Train Accuracy</td><td>~100%</td><td>~90-94%</td></tr>
    <tr><td>Test Accuracy</td><td>~65-75%</td><td>~87-93%</td></tr>
    <tr><td>Gap (Train - Test)</td><td>~25-35%</td><td>~3-7%</td></tr>
    <tr><td>Loss de Test</td><td>Diverge ↑↑</td><td>Estable ↔</td></tr>
    <tr><td>Weight Decay</td><td>0.0 (OFF)</td><td>0.01 (ON)</td></tr>
    <tr><td>Dropout</td><td>NO</td><td>p = 0.3</td></tr>
    <tr><td>Parametros</td><td>~19,000</td><td>~300</td></tr>
  </table>
</body></html>
